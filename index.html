<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Мероприятие | Добро.Центр ЯГПУ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f6f8;
  color: #18181b;
}

.page {
  max-width: 760px;
  margin: 0 auto;
  padding: 40px 20px 70px;
}

.back {
  display: inline-block;
  margin-bottom: 28px;
  color: #6d28d9;
  text-decoration: none;
  font-size: 15px;
  font-weight: 600;
}

.card {
  background: #fff;
  border-radius: 22px;
  padding: 36px;
  box-shadow: 0 8px 30px rgba(0,0,0,.06);
}

.label {
  display: inline-block;
  background: #f1eafe;
  color: #6d28d9;
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 20px;
}

h1 {
  margin: 0 0 28px;
  font-size: 36px;
  line-height: 1.15;
}

.info {
  display: grid;
  gap: 14px;
  margin-bottom: 30px;
  font-size: 17px;
}

.info-row {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.icon {
  width: 24px;
  flex: 0 0 24px;
}

.description {
  padding-top: 28px;
  border-top: 1px solid #e4e4e7;
  font-size: 17px;
  line-height: 1.65;
  white-space: pre-line;
}

.message {
  color: #71717a;
  font-size: 17px;
}

@media (max-width:600px) {
  .page {
    padding: 20px 14px 40px;
  }

  .card {
    padding: 24px 20px;
    border-radius: 16px;
  }

  h1 {
    font-size: 28px;
  }
}
</style>
</head>

<body>

<main class="page">

<a class="back" href="javascript:history.back()">
  ← Вернуться к календарю
</a>

<section class="card">

  <div class="label">Добро.Центр ЯГПУ</div>

  <div id="content">
    <div class="message">Загружаем мероприятие…</div>
  </div>

</section>

</main>

<script>

const ICS_URL =
"https://open-web-calendar.hosted.quelltext.eu/calendar.ics?specification_url=https%3A%2F%2Fgist.githubusercontent.com%2Fkrisbaxtina-create%2Fa7a03ca68d19b14c1ee437588415d0ff%2Fraw%2Fcalendar.json";

function unfoldICS(text) {
  return text.replace(/\r?\n[ \t]/g, "");
}

function unescapeICS(text = "") {
  return text
    .replace(/\\n/gi, "\n")
    .replace(/\\,/g, ",")
    .replace(/\\;/g, ";")
    .replace(/\\\\/g, "\\");
}

function getProperty(block, property) {
  const regex = new RegExp(
    "^" + property + "(?:;[^:]*)?:(.*)$",
    "mi"
  );

  const match = block.match(regex);
  return match ? unescapeICS(match[1].trim()) : "";
}

function parseDate(value) {

  if (!value) return null;

  const clean = value.replace(/Z$/, "");

  if (/^\d{8}$/.test(clean)) {
    return new Date(
      Number(clean.slice(0,4)),
      Number(clean.slice(4,6)) - 1,
      Number(clean.slice(6,8))
    );
  }

  if (/^\d{8}T\d{6}$/.test(clean)) {
    return new Date(
      Number(clean.slice(0,4)),
      Number(clean.slice(4,6)) - 1,
      Number(clean.slice(6,8)),
      Number(clean.slice(9,11)),
      Number(clean.slice(11,13)),
      Number(clean.slice(13,15))
    );
  }

  return null;
}

function formatDate(date) {
  if (!date) return "";

  return new Intl.DateTimeFormat("ru-RU", {
    day: "numeric",
    month: "long",
    year: "numeric"
  }).format(date);
}

function formatTime(date) {
  if (!date) return "";

  return new Intl.DateTimeFormat("ru-RU", {
    hour: "2-digit",
    minute: "2-digit"
  }).format(date);
}

function escapeHTML(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

async function loadEvent() {

  const params = new URLSearchParams(window.location.search);
  const uid = params.get("uid");

  const content = document.getElementById("content");

  if (!uid) {
    content.innerHTML =
      '<div class="message">Мероприятие не выбрано.</div>';
    return;
  }

  try {

    const response = await fetch(ICS_URL);

    if (!response.ok) {
      throw new Error("Ошибка загрузки календаря");
    }

    const raw = unfoldICS(await response.text());

    const events =
      raw.match(/BEGIN:VEVENT[\s\S]*?END:VEVENT/g) || [];

    const event = events.find(block =>
      getProperty(block, "UID") === uid
    );

    if (!event) {
      content.innerHTML =
        '<div class="message">Мероприятие не найдено.</div>';
      return;
    }

    const title = getProperty(event, "SUMMARY");
    const description = getProperty(event, "DESCRIPTION");
    const location = getProperty(event, "LOCATION");

    const startRaw = getProperty(event, "DTSTART");
    const endRaw = getProperty(event, "DTEND");

    const start = parseDate(startRaw);
    const end = parseDate(endRaw);

    let time = "";

    if (
      startRaw &&
      startRaw.includes("T") &&
      start
    ) {
      time = formatTime(start);

      if (end) {
        time += "–" + formatTime(end);
      }
    }

    document.title =
      title + " | Добро.Центр ЯГПУ";

    content.innerHTML = `
      <h1>${escapeHTML(title)}</h1>

      <div class="info">

        <div class="info-row">
          <div class="icon">📅</div>
          <div>${escapeHTML(formatDate(start))}</div>
        </div>

        ${
          time
          ? `
          <div class="info-row">
            <div class="icon">🕐</div>
            <div>${escapeHTML(time)}</div>
          </div>
          `
          : ""
        }

        ${
          location
          ? `
          <div class="info-row">
            <div class="icon">📍</div>
            <div>${escapeHTML(location)}</div>
          </div>
          `
          : ""
        }

      </div>

      ${
        description
        ? `
        <div class="description">${escapeHTML(description)}</div>
        `
        : ""
      }
    `;

  } catch (error) {

    console.error(error);

    content.innerHTML =
      '<div class="message">Не удалось загрузить информацию о мероприятии.</div>';
  }
}

loadEvent();

</script>

</body>
</html>
