<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мероприятие | Добро.Центр ЯГПУ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f6f8;
      color: #18181b;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 70px;
    }

    .back {
      display: inline-block;
      margin-bottom: 28px;
      color: #6d28d9;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 36px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    .label {
      display: inline-block;
      background: #f1eafe;
      color: #6d28d9;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 36px;
      line-height: 1.15;
    }

    .info {
      display: grid;
      gap: 14px;
      margin-bottom: 30px;
      font-size: 17px;
    }

    .info-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .icon {
      width: 24px;
      flex: 0 0 24px;
    }

    .description {
      padding-top: 28px;
      border-top: 1px solid #e4e4e7;
      font-size: 17px;
      line-height: 1.65;
      white-space: pre-line;
    }

    @media (max-width: 600px) {
      .page {
        padding: 20px 14px 40px;
      }

      .card {
        padding: 24px 20px;
        border-radius: 16px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <a class="back" href="javascript:history.back()">← Вернуться к календарю</a>

    <section class="card">

      <div class="label">Добро.Центр ЯГПУ</div>

      <h1>Фестиваль #МЫВМЕСТЕ</h1>

      <div class="info">

        <div class="info-row">
          <div class="icon">📅</div>
          <div>4 сентября 2026</div>
        </div>

        <div class="info-row">
          <div class="icon">🕐</div>
          <div>10:00–14:00</div>
        </div>

        <div class="info-row">
          <div class="icon">📍</div>
          <div>Дворец Молодёжи</div>
        </div>

      </div>

      <div class="description">
ВАКАНСИЯ НЕ ОТКРЫТА 🚩

Фестиваль пройдет на базе ГАУ «Дворец Молодежи». Необходима помощь 10 волонтеров на мероприятии.
      </div>

    </section>

  </main>

</body>
</html>
